services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/app}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      WORKERS: ${WORKERS:-1}
      INCLUDE_RULE: ${INCLUDE_RULE:-true}
      RULE_IN_DESCRIPTION: ${RULE_IN_DESCRIPTION:-true}
      JOB_TIMEOUT_SEC: ${JOB_TIMEOUT_SEC:-270}
      MODEL_DIR: ${MODEL_DIR:-/app/models}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - uploads:/data/uploads
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
  uploads:
